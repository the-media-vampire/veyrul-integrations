tools:
  - name: find_media_context
    description: Find saved media workflows, reusable code and source-qualified references for a public production question. Returns existing evidence; does not generate media or edit a scene.
    search_aliases: [find a media workflow, diagnose a media production failure, find reusable media code]
    source_file: scripts/find_media_context.py
    execution: sync
    affinity: any
    timeout_hint_secs: 12
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    group: veyrul
    input_schema:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 600
          description: Nonconfidential operation, relevant tool/version and constraints. Do not send private briefs, scene data, paths or credentials.
    output_schema:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
